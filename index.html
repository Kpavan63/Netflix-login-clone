<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card_animation</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(to right, #232526, #414345); /* Modern gradient */
            color: #f0f0f0; /* Light text color for contrast */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card{
            width: 320px; /* Slightly wider */
            border: none; /* Remove border, shadow will define edge */
            border-radius: 15px; /* More modern radius */
            margin:  40px auto; /* Adjusted margin for centering */
            height: auto; /* Auto height based on content */
            padding-bottom: 20px; /* Add some padding at the bottom */
            background: rgba(0, 0, 0, 0.75); /* Slightly transparent dark color */
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5); /* Lifted effect */
        }
        .icon{
            margin-top: 30px;
        }
        #title{
            font-family: 'Roboto', sans-serif; /* Modern font */
            color: #E50914; /* Netflix red */
            font-size: 32px; /* Slightly larger */
            margin-top: -10px; /* Adjust as needed */
            margin-bottom: 20px; /* Add space below title */
            cursor: pointer;
            font-weight: 700; /* Bolder title */
        }
        input[type="text"], input[type="password"] {
            width: calc(100% - 40px); /* Adjust width considering padding */
            padding: 12px 20px;
            margin: 10px 0; /* Consistent margin */
            border-radius: 8px; /* Modern radius */
            border: 1px solid #555; /* Subtle border */
            background: #333; /* Darker background */
            color: #fff; /* White text */
            box-sizing: border-box; /* Include padding and border in element's total width and height */
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }
        input[type="text"]:focus, input[type="password"]:focus {
            border-color: #E50914; /* Netflix red on focus */
            box-shadow: 0 0 5px rgba(229, 9, 20, 0.5); /* Glow effect */
            outline: none; /* Remove default outline */
        }
        input[type="text"]::placeholder, input[type="password"]::placeholder {
            color: #888; /* Lighter placeholder text */
        }

        input[type="submit"] {
            width: calc(100% - 40px);
            padding: 12px 20px;
            margin-top: 20px; /* Space above button */
            border-radius: 8px;
            border: none;
            background: #E50914; /* Netflix red */
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
            box-sizing: border-box;
        }
        input[type="submit"]:hover {
            background: #f6121D; /* Lighter red on hover */
        }

        /* Styles for checkbox and links to ensure readability */
        font[style="color: white;"], a[style="color: white; text-decoration:none"] {
            color: #f0f0f0 !important; /* Ensure high contrast for these elements */
        }
        a[style="color: white; text-decoration:none"]:hover {
            text-decoration: underline !important;
        }

       svg{
        animation: fadeInUp;
        animation-duration: 2s;
       }
       /* Error message style was already in the div, but can be centralized here */
       #error-message {
            /* color: #E50914; /* Using Netflix red for errors too */
            /* margin-top: 15px; /* Space above error message */
            /* font-weight: bold; */
            min-height: 20px; /* Reserve space to prevent layout shift */
       }
    </style>
</head>
<body style="display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0;">
    <div class="card">
        <div class="icon">
            <center>
                <svg xmlns="http://www.w3.org/2000/svg" x="0px" y="0px" width="150" height="150" viewBox="0 0 48 48" id="animated-svg">
                    <path fill="red" d="M5 18c.7 0 1.3 0 2 0 0 4.1 0 8.1 0 12.2-.8.1-1.6.2-2.3.3-1-2.5-2.7-6.8-2.7-6.8S2 28 2 30.8c.4 0-.2 0-2 .3 0-4.3 0-8.7 0-13 .8 0 2 0 2 0l3 7.3C5 25.4 5 20.8 5 18zM14.7 20c0-.6 0-1.4 0-2-1.9 0-3.8 0-5.7 0 0 4 0 8 0 12 1.9-.2 3.8-.4 5.7-.6 0-.6 0-1.4 0-2-1.2.1-2.4.1-3.7.4 0-1.1 0-1.7 0-2.8.9 0 2.1 0 3 0 0-.6 0-1.4 0-2-.9 0-2.1 0-3 0 0-1.1 0-1.9 0-3C11.6 20.1 14.2 20.1 14.7 20zM16 20c.1 0 1.9 0 2 0 0 3.2 0 6 0 9.2.7 0 1.3 0 2-.1 0-3.2 0-5.9 0-9.1.7 0 1.3 0 2 0 0-.6 0-1.4 0-2-2.1 0-3.9 0-6 0C16 18.6 16 19.4 16 20zM28.6 18c-1.9 0-3.7 0-5.6 0 0 3.8 0 7.2 0 11 .2 0 .4 0 .6 0 .4 0 .9 0 1.4 0 0-1.6 0-2.4 0-4 .1 0 2.4 0 2.7 0 0-.6 0-1.4 0-2-.3 0-2.6 0-2.7 0 0-1 0-2 0-3 .2 0 3.1 0 3.6 0C28.6 19.5 28.6 18.6 28.6 18zM32 27.5c0-3.3 0-6.2 0-9.5-.7 0-1.3 0-2 0 0 3.8 0 7.4 0 11.2 1.8.1 3.6.2 5.4.4 0-.6 0-1.3 0-1.9C34.3 27.6 33.1 27.5 32 27.5zM37 29.7c.7.1 1.3.1 2 .2 0-4 0-7.9 0-11.9-.7 0-1.3 0-2 0C37 22 37 25.8 37 29.7zM45.4 24.2c.9-2 1.7-4 2.6-6.1-.7 0-1.5 0-2.2 0-.5 1.3-.9 2.2-1.4 3.4-.5-1.3-.8-2.2-1.3-3.4-.7 0-1.5 0-2.2 0 .8 2 1.5 4 2.4 6.1-.9 2-1.7 4-2.6 6 .7.1 1.4.2 2.1.3.5-1.3 1-2.2 1.5-3.5.5 1.4 1 2.4 1.5 3.8.7.1 1.6.2 2.3.3C47.1 28.7 46.2 26.3 45.4 24.2z"></path>
                </svg>
            <h2 id="title"> Netflix Login</h2>
            </center>
        </div>
        <form action="">
           <input type="text" name="email/name" placeholder="Enter Your Email / Phone number" required>
           <br><br>
           <input type="password" name="Password" placeholder="Enter Your Password" required>
           <br><br>
            <input type="Checkbox"><font style="color: white;">Accept privacy policy of [or] </font><a href="#" style="color: white; text-decoration:none">Register Now</a> <font style="color: white;">Join For More Updates</font>
        
            <br><br>
            <input type="submit" value="Login Now" onclick="handleLogin()">
        </form>
        <div id="error-message" style="color: #E50914; margin-top: 15px; font-weight: bold; min-height: 20px;"></div>
    </div>

    <!-- Audio element -->
    <audio id="audio" src="netflix.mp3"></audio>

    <script>
        // Function to play sound when the SVG animation starts
        function playAudioOnAnimationStart() {
            var audio = document.getElementById("audio");
            audio.play();
        }

        // Timer function
        function startTimer(duration, callback) {
            setTimeout(callback, duration);
        }

        document.addEventListener("DOMContentLoaded", function() {
            var svgElement = document.getElementById("animated-svg");
            var emailInput = document.querySelector('input[name="email/name"]');
            var passwordInput = document.querySelector('input[name="Password"]');
            var errorMessageDiv = document.getElementById("error-message");

            // Attach event listener for SVG animation start
            if (svgElement) {
                svgElement.addEventListener("animationstart", function(event) {
                    if (event.animationName === 'fadeInUp') {
                        playAudioOnAnimationStart();
                        // Start timer after 1 seconds (adjust as needed)
                        startTimer(1000, function() {
                            console.log("Timer finished!");
                        });
                    }
                });
            }

            // Function to clear error messages
            function clearErrorMessage() {
                if (errorMessageDiv) {
                    errorMessageDiv.textContent = "";
                }
            }

            // Add event listeners to input fields to clear error on input
            if (emailInput) {
                emailInput.addEventListener('input', clearErrorMessage);
            }
            if (passwordInput) {
                passwordInput.addEventListener('input', clearErrorMessage);
            }
        });

        function popup(){ // This function seems unused now but kept for legacy if any other part uses it.
            window.alert("Netflix Login Error please Try Again");
        }

        function handleLogin() {
            const emailInput = document.querySelector('input[name="email/name"]');
            const passwordInput = document.querySelector('input[name="Password"]');
            const errorMessageDiv = document.getElementById("error-message");

            // Clear previous error messages
            errorMessageDiv.textContent = "";

            const emailValue = emailInput ? emailInput.value.trim() : "";
            const passwordValue = passwordInput ? passwordInput.value.trim() : "";

            if (emailValue === "") {
                errorMessageDiv.textContent = "Email/Phone cannot be empty!";
                return;
            }

            if (passwordValue === "") {
                errorMessageDiv.textContent = "Password cannot be empty!";
                return;
            }

            // If both fields have values, display the generic error (simulation)
            // No need for setTimeout here unless simulating network latency for this specific message
            errorMessageDiv.textContent = "Netflix Login Error please Try Again";
        }
    </script>
</body>
</html>
